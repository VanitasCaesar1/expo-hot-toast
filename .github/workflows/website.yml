name: Website

# Builds website/ (Astro) and publishes it to GitHub Pages. The docs come from
# docs/guide, and the playground is the example app exported for the web, so
# changes to either (or to the library) redeploy the site too.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/guide/**'
      - 'src/**'
      - 'example/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            package-lock.json
            example/package-lock.json
      # The playground: the example app, with the library, built for the web.
      - run: npm ci
      - run: npm ci
        working-directory: example
      - name: Export the playground
        run: npx expo export --platform web --output-dir ../website/public/playground
        working-directory: example
      - run: npm ci
        working-directory: website
      - run: npx astro check
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
