name: Website

# Builds website/ (Astro) and publishes it to GitHub Pages. The docs come from
# docs/guide, and the live demos run the example app exported for the web, so
# changes to either (or to the library) redeploy the site too. ci/** branches
# build the site as a check; only main deploys.

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'website/**'
      - 'docs/guide/**'
      - 'src/**'
      - 'example/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('website-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The docs show when each page last changed, from git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            package-lock.json
            example/package-lock.json
      # The example app, with the library, built for the web: the live demos load it.
      - run: npm ci
      - run: npm ci
        working-directory: example
      - name: Export the playground
        run: npx expo export --platform web --output-dir ../website/public/playground
        working-directory: example
      - run: npm ci
        working-directory: website
      - run: npx astro check
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: website/dist
      # Branch builds keep the site, to look at before it ships.
      - uses: actions/upload-artifact@v7
        if: github.ref != 'refs/heads/main'
        with:
          name: website
          path: website/dist
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
