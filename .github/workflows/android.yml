name: Android

# Builds the example app for Android and runs it on an emulator, driving every
# demo row with Maestro. Unit tests cannot reach the native side: this is what
# shows the opaque surface, gestures and layout actually work on Android.
#
# Branches named ci/* run it too, so a change can be checked before it lands.

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'src/**'
      - 'example/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'example/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Example on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm ci
        working-directory: example

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        working-directory: example

      # A release build embeds the JS bundle, so the emulator needs no Metro.
      # x86_64 only, because that is the emulator's ABI; it also halves the
      # native compile.
      - name: Build the release APK
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: example/android

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash example/scripts/android-smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: artifacts/android
          retention-days: 14
