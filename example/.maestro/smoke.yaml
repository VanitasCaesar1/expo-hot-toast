# Drives every row of the example and screenshots the result. Run by
# scripts/android-smoke.sh and scripts/ios-smoke.sh in CI against a build with
# EXPO_PUBLIC_E2E=1, where toasts last 60 seconds and requests take 15: on a
# GPU-less emulator each tap takes about three seconds, and on the CI simulator
# a step can take forty. Toasts are cleared by tapping them (tap-to-dismiss is on by
# default on Android) rather than by waiting, which tests that too.
appId: dev.expohottoast.example
---
- launchApp:
    clearState: true
# Dismiss a system "isn't responding" dialog if the emulator shows one anyway.
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      id: "row-success"
    timeout: 120000
- takeScreenshot: 01-home

# Success and error stack at the top, newest nearest the edge.
- tapOn:
    id: "row-success"
    waitToSettleTimeoutMs: 300
- assertVisible: "Changes saved"
- tapOn:
    id: "row-error"
    waitToSettleTimeoutMs: 300
- assertVisible: "Could not reach the server"
- takeScreenshot: 02-success-and-error

# Swipe one away, tap the other away.
# Sideways. iOS gets an explicit flick across the newest toast (around 12%
# down): an element swipe on a slow simulator dragged too slowly to count.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "25%, 12%"
          end: "95%, 12%"
          duration: 200
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            text: "Could not reach the server"
          direction: RIGHT
- extendedWaitUntil:
    notVisible: "Could not reach the server"
    timeout: 5000
# The swipe can outlast the success toast on a slow simulator, so only tap it if
# it is still there.
- runFlow:
    when:
      visible: "Changes saved"
    commands:
      - tapOn: "Changes saved"
- extendedWaitUntil:
    notVisible: "Changes saved"
    timeout: 5000

# Action button: runs the handler, then dismisses.
- tapOn:
    id: "row-with-an-action"
    waitToSettleTimeoutMs: 300
- assertVisible: "Undo"
- takeScreenshot: 03-action
- tapOn: "Undo"
- assertVisible: "Message restored"
- assertNotVisible: "Message archived"
- tapOn: "Message restored"
- extendedWaitUntil:
    notVisible: "Message restored"
    timeout: 5000

# Promise: loading, then the outcome in place of it.
- tapOn:
    id: "row-promise"
    waitToSettleTimeoutMs: 300
- assertVisible: "Uploading photo…"
- takeScreenshot: 04-promise-loading
- extendedWaitUntil:
    visible: "Photo uploaded"
    timeout: 30000
- assertNotVisible: "Uploading photo…"
- takeScreenshot: 05-promise-success
- tapOn: "Photo uploaded"
- tapOn:
    id: "row-promise-that-fails"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Sync failed: offline"
    timeout: 30000
- tapOn: "Sync failed: offline"
- extendedWaitUntil:
    notVisible: "Sync failed: offline"
    timeout: 5000

# A description under the message.
- tapOn:
    id: "row-with-a-description"
    waitToSettleTimeoutMs: 300
# On iOS the toast is one accessibility element labelled with the message
# and the description together, so match within it.
- assertVisible: ".*Check your connection and try again.*"
- takeScreenshot: 06a-description
- tapOn: ".*Could not upload photo.*"
- extendedWaitUntil:
    notVisible: ".*Could not upload photo.*"
    timeout: 5000

# Rich colours, then flicked up and away like a notification.
- tapOn:
    id: "row-rich-colours"
    waitToSettleTimeoutMs: 300
- assertVisible: "Payment received"
- takeScreenshot: 06b-rich-colours
# An element swipe aims at a point near the top of the screen, which on iOS is
# only about 16pt above a top toast: too short and slow to count. So iOS gets
# an explicit flick from the toast (it sits around 12% down) to the top edge.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%, 12%"
          end: "50%, 1%"
          duration: 150
# Android's Material snackbars rise from the bottom and are swiped sideways,
# as Material 3 has it. An element swipe starts at the text's centre, near the
# left edge, which leaves too little room to the edge to count; this flick
# crosses most of the snackbar (around 92% down).
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "85%, 92%"
          end: "10%, 92%"
          duration: 200
- extendedWaitUntil:
    notVisible: "Payment received"
    timeout: 5000

# Five at once: the first three show, the other two wait their turn and are
# promoted, in order, as space frees.
- scrollUntilVisible:
    element:
      id: "row-burst-of-five"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "row-burst-of-five"
    waitToSettleTimeoutMs: 300
- assertVisible: "Item 1 added to cart"
- assertVisible: "Item 3 added to cart"
- assertNotVisible: "Item 4 added to cart"
- assertNotVisible: "Item 5 added to cart"
- takeScreenshot: 06-burst-queue
- tapOn: "Item 1 added to cart"
- extendedWaitUntil:
    visible: "Item 4 added to cart"
    timeout: 5000
- tapOn: "Item 2 added to cart"
- extendedWaitUntil:
    visible: "Item 5 added to cart"
    timeout: 5000
- tapOn: "Item 3 added to cart"
- tapOn: "Item 4 added to cart"
- tapOn: "Item 5 added to cart"
- extendedWaitUntil:
    notVisible: "Item 5 added to cart"
    timeout: 5000

# Three taps, one toast: dismissing it leaves nothing behind. Rows are
# scrolled to the middle first, clear of Android's bottom snackbars.
- scrollUntilVisible:
    element:
      id: "row-deduplicated"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "row-deduplicated"
    waitToSettleTimeoutMs: 300
- tapOn:
    id: "row-deduplicated"
    waitToSettleTimeoutMs: 300
- tapOn:
    id: "row-deduplicated"
    waitToSettleTimeoutMs: 300
- takeScreenshot: 07-dedupe
# Matched as a substring: the toast reads its repeat count too ("3 times").
- tapOn: ".*Saving draft….*"
- extendedWaitUntil:
    notVisible: ".*Saving draft….*"
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "row-from-the-bottom"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "row-from-the-bottom"
    waitToSettleTimeoutMs: 300
- assertVisible: "Message sent"
- takeScreenshot: 08-bottom
- tapOn: "Message sent"
- extendedWaitUntil:
    notVisible: "Message sent"
    timeout: 5000

# Stacked: three toasts collapse behind the newest. Toggling clears the screen.
- scrollUntilVisible:
    element:
      id: "row-stacked"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "row-stacked"
    waitToSettleTimeoutMs: 300
- scrollUntilVisible:
    element:
      id: "row-burst-of-five"
    direction: UP
    centerElement: true
- tapOn:
    id: "row-burst-of-five"
    waitToSettleTimeoutMs: 300
- assertVisible: "Item 3 added to cart"
- takeScreenshot: 08b-stacked
- scrollUntilVisible:
    element:
      id: "row-stacked"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "row-stacked"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible: "Item 3 added to cart"
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "row-custom-element"
    direction: DOWN
    centerElement: true

- tapOn:
    id: "row-close-button"
    waitToSettleTimeoutMs: 300
- assertVisible: "Export started. This can take a minute."
- takeScreenshot: 09-close-button
- tapOn: "Dismiss"
- extendedWaitUntil:
    notVisible: "Export started. This can take a minute."
    timeout: 5000

# Opaque surface sits above Close button and Custom element below it; the
# earlier scroll can leave either one out of view, so bring each in first.
- scrollUntilVisible:
    element:
      id: "row-opaque-surface"
    direction: UP
    centerElement: true
- tapOn:
    id: "row-opaque-surface"
    waitToSettleTimeoutMs: 300
- assertVisible: "Drawn without glass"
- scrollUntilVisible:
    element:
      id: "row-custom-element"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "row-custom-element"
    waitToSettleTimeoutMs: 300
- assertVisible: "Fully custom content"
- takeScreenshot: 10-opaque-and-custom
