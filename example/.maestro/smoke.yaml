# Drives every row of the example and screenshots the result. Run by
# scripts/android-smoke.sh in CI, against a build with EXPO_PUBLIC_E2E=1 so
# toasts last 6 seconds. Taps skip Maestro's settle-wait (a spinner never
# settles, and a toast could expire meanwhile), and the flow waits for toasts
# to clear between groups so none sits on top of the next row to tap.
appId: dev.expohottoast.example
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Success"
    timeout: 120000
- takeScreenshot: 01-home

# Success and error stack at the top.
- tapOn:
    text: "Success"
    waitToSettleTimeoutMs: 300
- assertVisible: "Changes saved"
- tapOn:
    text: "Error"
    waitToSettleTimeoutMs: 300
- assertVisible: "Could not reach the server"
- takeScreenshot: 02-success-and-error

# Swipe one away.
- swipe:
    from:
      text: "Could not reach the server"
    direction: RIGHT
- extendedWaitUntil:
    notVisible: "Could not reach the server"
    timeout: 4000
- extendedWaitUntil:
    notVisible: "Changes saved"
    timeout: 10000

# Action button.
- tapOn:
    text: "With an action"
    waitToSettleTimeoutMs: 300
- assertVisible: "Undo"
- takeScreenshot: 03-action
- tapOn: "Undo"
- assertVisible: "Message restored"
- extendedWaitUntil:
    notVisible: "Message restored"
    timeout: 10000

# Promise: loading, then the outcome in place.
- tapOn:
    text: "Promise"
    waitToSettleTimeoutMs: 300
- assertVisible: "Uploading photo…"
- takeScreenshot: 04-promise-loading
- extendedWaitUntil:
    visible: "Photo uploaded"
    timeout: 8000
- takeScreenshot: 05-promise-success
- tapOn:
    text: "Promise that fails"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Sync failed: offline"
    timeout: 8000
- extendedWaitUntil:
    notVisible: "Sync failed: offline"
    timeout: 12000

# Five at once: three show, two wait their turn.
- tapOn:
    text: "Burst of five"
    waitToSettleTimeoutMs: 300
- assertVisible: "Item 5 added to cart"
- assertNotVisible: "Item 1 added to cart"
- takeScreenshot: 06-burst-queue
# The waiting two are promoted as the first three leave.
- extendedWaitUntil:
    visible: "Item 1 added to cart"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Item 1 added to cart"
    timeout: 15000

# Three taps, one toast.
- tapOn:
    text: "Deduplicated"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Deduplicated"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Deduplicated"
    waitToSettleTimeoutMs: 300
- takeScreenshot: 07-dedupe

- tapOn:
    text: "From the bottom"
    waitToSettleTimeoutMs: 300
- assertVisible: "Message sent"
- takeScreenshot: 08-bottom
- extendedWaitUntil:
    notVisible: "Message sent"
    timeout: 10000

- scrollUntilVisible:
    element:
      text: "Custom element"
    direction: DOWN

- tapOn:
    text: "Close button"
    waitToSettleTimeoutMs: 300
- assertVisible: "Export started. This can take a minute."
- takeScreenshot: 09-close-button
- tapOn: "Dismiss"
- extendedWaitUntil:
    notVisible: "Export started. This can take a minute."
    timeout: 4000

- tapOn:
    text: "Opaque surface"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Custom element"
    waitToSettleTimeoutMs: 300
- assertVisible: "Fully custom content"
- takeScreenshot: 10-opaque-and-custom
