# Starts the scripted rich-toast demo (playRichDemo in App.tsx) for the
# website's recordings. The scripts record the screen around this flow.
appId: dev.expohottoast.example
---
- launchApp
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      id: "row-success"
    timeout: 60000
- longPressOn:
    id: "play-rich-demo"
