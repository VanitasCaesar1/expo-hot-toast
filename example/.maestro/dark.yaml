# The same surfaces in dark mode. The script switches the system theme first.
appId: dev.expohottoast.example
---
- launchApp
# Dismiss a system "isn't responding" dialog if the emulator shows one anyway.
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      id: "row-success"
    timeout: 60000
- tapOn:
    id: "row-success"
    waitToSettleTimeoutMs: 300
- tapOn:
    id: "row-error"
    waitToSettleTimeoutMs: 300
- tapOn:
    id: "row-with-an-action"
    waitToSettleTimeoutMs: 300
- assertVisible: "Changes saved"
- assertVisible: "Could not reach the server"
- assertVisible: "Undo"
- takeScreenshot: 11-dark-stack
