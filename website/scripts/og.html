<!doctype html>
<!--
  The 1200x630 share image (public/media/og.png). Uses the iOS poster cut by
  cut-media.py. Regenerate after new recordings: open this file in a browser at
  1200x630 (or with Playwright) and screenshot it to public/media/og.png.
-->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Bri;src:url(../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2)}
@font-face{font-family:Gei;src:url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2)}
@font-face{font-family:Mon;src:url(../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#121211;color:#f3f1ec;font-family:Gei;overflow:hidden;position:relative}
.frame{position:absolute;inset:0 40px;border-inline:1px solid #2d2c2a}
.split{position:absolute;top:0;bottom:0;left:640px;border-left:1px solid #2d2c2a;right:40px;
  background-image:radial-gradient(rgb(243 241 236/.09) 1px,transparent 1px);background-size:16px 16px}
.glow{position:absolute;left:600px;right:0;bottom:-180px;height:420px;background:radial-gradient(closest-side,rgb(255 173 59/.20),transparent)}
.mark{position:absolute;top:44px;left:88px;display:flex;align-items:center;gap:12px;font-size:24px;font-weight:550;letter-spacing:-.01em}
.mark img{display:block;margin-block:-8px}
.kick{position:absolute;left:88px;top:196px;font-family:Mon;font-size:16px;letter-spacing:.14em;color:#ffad3b;font-weight:500}
h1{position:absolute;left:84px;top:232px;font-family:Bri;font-weight:500;font-size:88px;line-height:.98;letter-spacing:-.035em;width:540px}
.sub{position:absolute;left:88px;top:470px;font-size:22px;line-height:1.45;color:rgb(243 241 236/.62);width:480px}
.phone{position:absolute;left:688px;top:56px;width:450px;height:980px;border-radius:74px;background:#0b0b0a;padding:12px;
  box-shadow:0 0 0 1.5px #3a3936, 0 40px 80px rgb(0 0 0/.6)}
.phone div{width:100%;height:100%;border-radius:62px;overflow:hidden;background:#000 url(../public/media/ios-demo-dark.jpg) top/100% auto no-repeat}
</style></head><body>
<div class="frame"></div><div class="split"></div><div class="glow"></div>
<div class="mark"><img src="../public/mark.svg" width="40" height="40" alt="">expo-hot-toast</div>
<div class="kick">OPEN SOURCE · EXPO · REACT NATIVE</div>
<h1>Toasts in real Liquid Glass.</h1>
<p class="sub">The react-hot-toast API, drawn with Apple's own material on iOS 26 and a designed surface on Android.</p>
<div class="phone"><div></div></div>
</body></html>
